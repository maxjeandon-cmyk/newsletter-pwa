name: Agent maintenance
on:
  push:
    branches: [vibe/agent-maintenance-872491]
  schedule:
    # toutes les 6 h : 3 h, 9 h, 15 h et 21 h heure de Paris (GitHub schedule utilise UTC ; +1 h en été)
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer et résumer les feedback + maintenance du site
        run: node tools/maintenance.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
