name: Agent maintenance
on:
  schedule:
    # toutes les 6 h : 3 h, 9 h, 15 h et 21 h heure de Paris (GitHub schedule utilise UTC ; +1 h en été)
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer et résumer les feedback + maintenance du site
        run: node tools/maintenance.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          # v40 : toutes les publications passent par GITHUB_TOKEN (Contents: RW
          # via le bloc permissions ci-dessus) — le PAT fine-grained
          # NOTIF_DISPATCH_TOKEN a expiré vers le 02/11/2026 : 10 runs de
          # l agent en échec consécutif, plus aucune publication de rapport ni
          # de relevés depuis. Perte acceptée : le déclenchement quasi
          # instantané du workflow Notifications push après publication (un
          # événement créé par GITHUB_TOKEN ne déclenche pas de run) — le
          # filet horaire cron '21 * * * *' du notifier couvre l envoi dans
          # l heure qui suit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
