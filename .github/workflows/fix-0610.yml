name: Fix edition 0610
on:
  push:
    paths:
      - 'tools/fix-0610.js'
permissions:
  contents: write
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normaliser edition 2026-10-06
        run: node tools/fix-0610.js
      - name: Pousser la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/2026-10-06.json
          git diff --cached --quiet && echo "rien a pousser" && exit 0
          git commit -m "Edition 2026-10-06 : normalisation fiabilite et dates maj (fix CI)"
          git push
