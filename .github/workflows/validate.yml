name: Validation des éditions

on:
  push:
    paths:
      - 'editions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider la dernière édition (JSON + HTML)
        run: node tools/validate-latest.js
      - name: Vérifier le site public
        run: node tools/check-site.js
