name: Indices El Nino quotidiens
on:
  # Cron quotidien remplace par une tache planifiee Vibe Work depuis le
  # 14/10/2026 : ce workflow reste disponible en secours, en declenchement
  # manuel uniquement (bouton "Run workflow" sur main).
  workflow_dispatch:
    inputs:
      test:
        description: 'Test du script elnino-indices.js sans push'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  maj-indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Maj des indices El Nino
        run: node tools/elnino-indices.js | tee /tmp/elnino.log
      - name: Commit si donnees modifiees
        run: |
          grep -q "DONNEES MODIFIEES" /tmp/elnino.log || { echo "Donnees inchangees, pas de commit."; exit 0; }
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/elnino-indices.json
          git diff --cached --quiet || git commit -m "Indices El Nino : maj quotidienne RONI/ONI"
          git push
