name: Notifications push
on:
  push:
    paths:
      - 'editions/latest.json'
      - 'data/climat.json'
      - 'data/notif-test.json'
  schedule:
    - cron: '21 * * * *'   # filet de securite horaire
  workflow_dispatch:
    inputs:
      test:
        description: 'Notification test a tous les abonnements (hors prefs et hors dedup)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer web-push
        run: npm install --no-save web-push
      - name: Envoyer les notifications (groupées, limitées)
        run: node tools/notifier.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIF_TEST: ${{ inputs.test }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
