<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Newsletter — Maxime</title>
<meta name="theme-color" content="#0e0e12"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icons/icon.svg"/>
</head>
<body>
<header id="topbar">
  <h1>Newsletter <span id="edition-date"></span></h1>
  <button id="btn-refresh" aria-label="Actualiser">⟳</button>
  <button id="btn-settings" aria-label="Réglages">⚙️</button>
</header>
<div id="stale-banner" hidden></div>
<nav id="tabs" aria-label="Chapitres"></nav>
<main id="view"></main>
<div id="settings-panel" hidden>
  <div class="panel-card">
    <h2>Réglages</h2>
    <label>Apparence
      <select id="sel-theme">
        <option value="dark">Sombre (défaut)</option>
        <option value="light">Clair</option>
        <option value="auto">Auto</option>
      </select>
    </label>
    <h3>Mes flux suivis</h3>
    <ul id="chapters-editor"></ul>
    <button id="btn-reset-chapters">Restaurer par défaut</button>
    <button id="btn-purge">Purger le cache</button>
    <button id="btn-install-hint">Installer sur iPhone</button>
    <p class="hint">Sur iPhone : bouton Partager ⬆️ puis « Sur l'écran d'accueil ».</p>
    <button id="btn-close-settings">Fermer</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
